services:
  app:
    image: synced
    container_name: synced
    build: .
    restart: unless-stopped
    ports:
      - "${HOST:-127.0.0.1}:${PORT:-3000}:3000"
    env_file: .env
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - TRUST_PROXY=loopback,linklocal,uniquelocal
    volumes:
      - ./uploads:/app/uploads
